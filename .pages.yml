media:
  input: public/media
  output: /media
  extensions: [webp, jpg, jpeg, png, avif]
  categories: [image]
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: добавить {name}"
      update: "content: обновить {name}"
      delete: "content: удалить {name}"
      rename: "content: переименовать {oldFilename} в {newFilename}"

actions:
  - name: generate-news-draft
    label: Создать статьи с ИИ
    workflow: generate-news-draft.yml
    ref: current
    cancelable: false
    confirm:
      title: Создать статьи через DeepSeek?
      message: Можно создать до 30 статей. Все материалы будут сохранены как черновики для ручной проверки и настройки.
      button: Запустить генерацию
    fields:
      - name: articleRequests
        label: Темы — по одной на строку
        type: textarea
        required: true
        description: Формат строки — «Тема | проверенные факты». Часть после вертикальной черты необязательна. Все остальные требования задаются в файле «Основной промпт».

components:
  seo:
    type: object
    label: SEO и отображение в поиске
    fields:
      - name: title
        label: Заголовок страницы
        type: string
        required: true
      - name: description
        label: Описание страницы
        type: text
        required: true
      - name: canonicalPath
        label: Канонический адрес
        type: string
        required: true
        description: Путь должен начинаться и заканчиваться символом /.
      - name: ogImage
        label: Изображение для социальных сетей
        type: image
        required: true
      - name: noindex
        label: Запретить индексацию
        type: boolean
        default: false

content:
  - name: pages
    label: Страницы
    type: group
    items:
      - name: home
        label: Главная страница
        type: file
        path: src/content/home/index.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: hero
            label: Первый экран
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Надзаголовок
                type: string
                required: true
              - name: title
                label: Главный заголовок
                type: string
                required: true
              - name: background
                label: Фоновое изображение
                type: image
                required: true
              - name: materials
                label: Ссылки на материалы
                type: object
                required: true
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Название
                    type: string
                    required: true
                  - name: image
                    label: Изображение
                    type: image
                    required: true
                  - name: href
                    label: Ссылка
                    type: string
                    required: true
          - name: about
            label: О компании
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Надзаголовок
                type: string
                required: true
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: lead
                label: Вводный текст
                type: text
                required: true
              - name: servicesTitle
                label: Заголовок списка услуг
                type: string
                required: true
              - name: services
                label: Услуги
                type: string
                required: true
                list: true
              - name: detailsHref
                label: Ссылка «Подробнее»
                type: string
                required: true
              - name: mainImage
                label: Основное изображение
                type: image
                required: true
              - name: mainImageAlt
                label: Описание основного изображения
                type: string
                required: true
              - name: secondaryImage
                label: Дополнительное изображение
                type: image
                required: true
              - name: secondaryImageAlt
                label: Описание дополнительного изображения
                type: string
                required: true
              - name: badgeTitle
                label: Текст на плашке
                type: string
                required: true
              - name: badgeText
                label: Подпись на плашке
                type: string
                required: true
              - name: features
                label: Преимущества
                type: object
                required: true
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Заголовок
                    type: string
                    required: true
                  - name: text
                    label: Текст
                    type: text
                    required: true
          - name: promo
            label: Промо-блок
            type: object
            required: true
            fields:
              - name: background
                label: Фоновое изображение
                type: image
                required: true
              - name: cards
                label: Карточки
                type: object
                required: true
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: eyebrow
                    label: Надзаголовок
                    type: string
                    required: true
                  - name: title
                    label: Заголовок
                    type: string
                    required: true
                  - name: button
                    label: Текст кнопки
                    type: string
                    required: true
                  - name: href
                    label: Ссылка
                    type: string
                    required: true
          - name: video
            label: Видео о компании
            type: object
            required: true
            fields:
              - name: src
                label: Ссылка для встраивания Kinescope
                type: string
                required: true
                pattern:
                  regex: "^https://kinescope\\.io/embed/"
                  message: Укажите ссылку вида https://kinescope.io/embed/...
              - name: title
                label: Описание видео
                type: string
                required: true
          - name: technology
            label: Технологии
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Надзаголовок
                type: string
                required: true
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: image
                label: Изображение
                type: image
                required: true
              - name: imageAlt
                label: Описание изображения
                type: string
                required: true
              - name: items
                label: Технологии
                type: object
                required: true
                list:
                  collapsible:
                    collapsed: true
                    summary: "{number}: {text}"
                fields:
                  - name: number
                    label: Номер
                    type: string
                    required: true
                  - name: text
                    label: Описание
                    type: text
                    required: true
          - name: director
            label: Обращение директора
            type: object
            required: true
            fields:
              - name: image
                label: Фотография
                type: image
                required: true
              - name: imageAlt
                label: Описание фотографии
                type: string
                required: true
              - name: quote
                label: Цитата
                type: text
                required: true
              - name: text
                label: Текст под цитатой
                type: text
                required: true
              - name: name
                label: Имя
                type: string
                required: true
              - name: role
                label: Должность
                type: string
                required: true
          - name: projects
            label: Проекты на главной
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Название
                type: string
                required: true
              - name: image
                label: Изображение
                type: image
                required: true
              - name: area
                label: Площадь
                type: string
                required: true
              - name: size
                label: Размер
                type: string
                required: true
              - name: floors
                label: Этажей
                type: string
                required: true
              - name: rooms
                label: Комнат
                type: string
                required: true
              - name: target
                label: Ссылка на проект
                type: string
                required: true
          - name: portfolio
            label: Портфолио на главной
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Название
                type: string
                required: true
              - name: image
                label: Изображение
                type: image
                required: true
          - name: reviews
            label: Отзывы на главной
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: excerpt
                label: Краткий текст
                type: text
              - name: date
                label: Дата
                type: date
                required: true
                options:
                  format: "dd.MM.yyyy"
              - name: image
                label: Изображение
                type: image
                required: true
              - name: href
                label: Ссылка на отзыв
                type: string
                required: true
          - name: news
            label: Новости на главной
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: excerpt
                label: Краткий текст
                type: text
              - name: date
                label: Дата
                type: date
                required: true
                options:
                  format: "dd.MM.yyyy"
              - name: image
                label: Изображение
                type: image
                required: true
              - name: href
                label: Ссылка на новость
                type: string
                required: true
          - name: seo
            component: seo

      - name: history
        label: О компании — история
        type: file
        path: src/content/history/index.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Заголовок
            type: string
            required: true
          - name: lead
            label: Вводные абзацы
            type: text
            required: true
            list: true
          - name: periods
            label: Периоды
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Название периода
                type: string
                required: true
              - name: milestones
                label: События
                type: object
                required: true
                list:
                  collapsible:
                    collapsed: true
                    summary: "{year}: {text}"
                fields:
                  - name: year
                    label: Год
                    type: string
                  - name: text
                    label: Событие
                    type: text
                    required: true
          - name: gallery
            label: Галерея
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{alt}"
            fields:
              - name: src
                label: Изображение
                type: image
                required: true
              - name: alt
                label: Описание изображения
                type: string
                required: true
          - name: seo
            component: seo

  - name: projects
    label: Проекты и работы
    type: group
    items:
      - name: catalog
        label: Каталог проектов
        type: collection
        path: src/content/catalog
        format: json
        filename:
          template: "{title}.json"
          field: false
        operations:
          create: true
          rename: false
          delete: true
        view:
          fields: [title, category, area, order]
          primary: title
          sort: [order, title, category]
          search: [title, name, category]
          default:
            sort: order
            order: asc
        fields:
          - name: order
            label: Позиция в списке
            type: number
            required: true
            default: 0
            description: Чем меньше число, тем выше проект в списке.
          - name: category
            label: Раздел каталога
            type: select
            required: true
            options:
              values:
                - name: house
                  label: Дома
                - name: sauna
                  label: Бани
          - name: title
            label: Заголовок карточки
            type: string
            required: true
          - name: name
            label: Название проекта
            type: string
            required: true
          - name: area
            label: Площадь
            type: string
            required: true
            description: Например, 91 кв.м.
          - name: size
            label: Размер
            type: string
            required: true
            description: Например, 9×12 м.
          - name: floors
            label: Этажность
            type: string
            required: true
          - name: rooms
            label: Количество комнат
            type: string
          - name: bathrooms
            label: Количество санузлов
            type: string
          - name: duration
            label: Срок строительства
            type: string
            required: true
          - name: image
            label: Изображение проекта
            type: image
            required: true

      - name: catalog_settings
        label: Настройки каталога
        type: file
        path: src/content/catalog-settings/index.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: seo
            label: SEO разделов
            type: object
            required: true
            fields:
              - name: house
                component: seo
                label: Каталог домов
              - name: sauna
                component: seo
                label: Каталог бань
          - name: packageSections
            label: Базовая комплектация
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Раздел
                type: string
                required: true
              - name: items
                label: Пункты
                type: string
                required: true
                list: true

      - name: portfolio
        label: Портфолио
        type: collection
        path: src/content/portfolio
        format: json
        filename:
          template: "{title}.json"
          field: false
        operations:
          create: true
          rename: false
          delete: true
        view:
          fields: [title, order]
          primary: title
          sort: [order, title]
          search: [title]
          default:
            sort: order
            order: asc
        fields:
          - name: order
            label: Позиция в списке
            type: number
            required: true
            default: 0
            description: Чем меньше число, тем выше работа в списке.
          - name: title
            label: Название работы
            type: string
            required: true
          - name: cover
            label: Обложка
            type: image
            required: true
          - name: images
            label: Фотографии
            type: image
            required: true
            options:
              multiple: true
              unique: true

      - name: portfolio_settings
        label: SEO портфолио
        type: file
        path: src/content/portfolio-settings/index.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Заголовок страницы
            type: string
            required: true
          - name: description
            label: Описание страницы
            type: text
            required: true
          - name: canonicalPath
            label: Канонический адрес
            type: string
            required: true
          - name: ogImage
            label: Изображение для социальных сетей
            type: image
            required: true
          - name: noindex
            label: Запретить индексацию
            type: boolean
            default: false

  - name: appearance
    label: Оформление сайта
    type: group
    items:
      - name: appearance_settings
        label: Цветовая палитра
        type: file
        path: src/content/appearance/settings.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: accent
            label: Основной акцент
            type: string
            required: true
            pattern: &hex_color
              regex: "^#[0-9a-fA-F]{6}$"
              message: Укажите HEX-цвет, например #96ce5a.
          - name: accentHover
            label: Акцент при наведении
            type: string
            required: true
            pattern: *hex_color
          - name: accentDark
            label: Темный акцент
            type: string
            required: true
            pattern: *hex_color
          - name: brown
            label: Фирменный коричневый
            type: string
            required: true
            pattern: *hex_color
          - name: ink
            label: Основной текст
            type: string
            required: true
            pattern: *hex_color
          - name: muted
            label: Вторичный текст
            type: string
            required: true
            pattern: *hex_color
          - name: paper
            label: Основной фон
            type: string
            required: true
            pattern: *hex_color
          - name: cream
            label: Дополнительный фон
            type: string
            required: true
            pattern: *hex_color

  - name: publications
    label: Публикации
    type: group
    items:
      - name: news
        label: Новости
        type: collection
        path: src/content/news
        format: json
        filename:
          template: "{date}-{title}.json"
          field: false
        operations:
          create: true
          rename: false
          delete: true
        view:
          fields: [title, status, publishAt, date, order]
          primary: title
          sort: [order, date, title]
          search: [title, description]
          default:
            sort: order
            order: desc
        fields:
          - name: status
            label: Статус публикации
            type: select
            required: true
            default: draft
            description: Черновики и запланированные статьи видны в Cloudflare, но до даты публикации не попадают в Yandex Cloud.
            options:
              values:
                - name: draft
                  label: Черновик
                - name: scheduled
                  label: Запланировано
                - name: published
                  label: Опубликовано
          - name: publishAt
            label: Дата автоматической публикации
            type: date
            description: Обязательна для статуса «Запланировано». Ежедневный workflow публикует готовые статьи с наступившей датой.
            options:
              format: "yyyy-MM-dd"
          - name: order
            label: Позиция в списке
            type: number
            required: true
            description: Порядковый номер публикации. Для новой статьи укажите следующий номер после текущего максимального; свежие статьи с большими номерами отображаются выше.
          - name: title
            label: Заголовок
            type: string
            required: true
          - name: description
            label: Краткое описание
            type: text
            required: true
          - name: date
            label: Дата публикации
            type: date
            required: true
            options:
              format: "dd.MM.yyyy"
          - name: cover
            label: Обложка
            type: image
            required: true
          - name: blocks
            label: Содержание
            type: block
            required: true
            list:
              collapsible:
                collapsed: false
                summary: "Блок {index}"
            blockKey: type
            blocks:
              - name: paragraph
                label: Абзац
                fields:
                  - name: text
                    label: Текст
                    type: text
                    required: true
              - name: heading
                label: Подзаголовок
                fields:
                  - name: text
                    label: Текст
                    type: string
                    required: true
              - name: quote
                label: Цитата
                fields:
                  - name: text
                    label: Текст
                    type: text
                    required: true
              - name: list
                label: Список
                fields:
                  - name: ordered
                    label: Нумерованный список
                    type: boolean
                    default: false
                  - name: items
                    label: Пункты
                    type: string
                    required: true
                    list: true
              - name: image
                label: Изображение
                fields:
                  - name: src
                    label: Файл
                    type: image
                    required: true
                  - name: alt
                    label: Описание изображения
                    type: string
                    required: true
              - name: video
                label: Видео Kinescope
                fields:
                  - name: src
                    label: Ссылка для встраивания
                    type: string
                    required: true
                    pattern:
                      regex: "^https://kinescope\\.io/embed/"
                      message: Укажите ссылку вида https://kinescope.io/embed/...

      - name: news_settings
        label: SEO новостей
        type: file
        path: src/content/news-settings/index.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Заголовок страницы
            type: string
            required: true
          - name: description
            label: Описание страницы
            type: text
            required: true
          - name: canonicalPath
            label: Канонический адрес
            type: string
            required: true
          - name: ogImage
            label: Изображение для социальных сетей
            type: image
            required: true
          - name: noindex
            label: Запретить индексацию
            type: boolean
            default: false

      - name: news_automation
        label: ИИ и расписание новостей
        type: file
        path: src/content/news-automation/settings.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: scheduleEnabled
            label: Автоматическая публикация включена
            type: boolean
            required: true
            default: true
          - name: model
            label: Модель DeepSeek
            type: select
            required: true
            default: deepseek-flash
            options:
              values:
                - name: deepseek-flash
                  label: DeepSeek Flash — дешевле и быстрее
                - name: deepseek-v4-pro
                  label: DeepSeek V4 Pro — качественнее и дороже
          - name: temperature
            label: Вариативность текста
            type: number
            required: true
            default: 0.4
            description: Значение от 0 до 2. Для стабильного стиля рекомендуется 0.3–0.6.
          - name: maxBatchSize
            label: Максимум статей за один запуск
            type: number
            required: true
            default: 30
          - name: maxPublicationsPerRun
            label: Максимум публикаций за запуск планировщика
            type: number
            required: true
            default: 1
            description: Сколько готовых запланированных статей можно опубликовать за один ежедневный запуск. Для режима «одна статья в день» оставьте 1.
          - name: defaultCover
            label: Обложка для новых статей
            type: image
            required: true
            description: Можно выбрать общую готовую обложку. Со служебной обложкой автопубликация будет остановлена до ее замены.

      - name: news_generation_prompt
        label: Основной промпт для статей
        type: file
        path: prompts/news-article-prompt.md
        format: code
        operations:
          create: false
          rename: false
          delete: false

      - name: materials
        label: Материалы
        type: collection
        path: src/content/materials
        format: json
        filename:
          template: "{date}-{title}.json"
          field: false
        operations:
          create: true
          rename: false
          delete: true
        view:
          fields: [title, date, order]
          primary: title
