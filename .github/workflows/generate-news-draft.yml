name: Generate news draft with AI

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload as JSON
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: generate-news-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate, validate and save draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
      YANDEX_AI_API_KEY: ${{ secrets.YANDEX_AI_API_KEY }}
      YANDEX_FOLDER_ID: ${{ vars.YANDEX_FOLDER_ID }}
      YANDEX_AI_MODEL: ${{ vars.YANDEX_AI_MODEL || 'yandexgpt/latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate AI configuration
        shell: bash
        run: |
          if [ -z "${YANDEX_AI_API_KEY}" ]; then
            echo "YANDEX_AI_API_KEY is not configured."
            exit 1
          fi

          if [ -z "${YANDEX_FOLDER_ID}" ]; then
            echo "YANDEX_FOLDER_ID is not configured."
            exit 1
          fi

      - name: Generate draft
        id: generate
        run: node scripts/generate-news-draft.mjs

      - name: Run lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build preview
        run: pnpm build:preview

      - name: Commit draft
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${{ steps.generate.outputs.draft_path }}"
          git commit -m "content: добавить черновик новости с ИИ"
          git push

      - name: Start Cloudflare preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare-preview.yml --ref "${GITHUB_REF_NAME}"

      - name: Add job summary
        shell: bash
        run: |
          {
            echo "## Черновик создан"
            echo
            echo "**${{ steps.generate.outputs.draft_title }}**"
            echo
            echo "Файл: \`${{ steps.generate.outputs.draft_path }}\`"
            echo
            echo "После завершения Cloudflare workflow откройте черновик в Pages CMS и проверьте факты, текст и обложку."
          } >> "${GITHUB_STEP_SUMMARY}"
