name: Generate news with DeepSeek

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload as JSON
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: generate-news-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate, validate and save articles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate DeepSeek configuration
        shell: bash
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "DEEPSEEK_API_KEY is not configured."
            exit 1
          fi

      - name: Generate articles
        id: generate
        run: node scripts/generate-news-draft.mjs

      - name: Run lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build preview
        run: pnpm build:preview

      - name: Commit generated articles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/content/news
          git commit -m "content: добавить статьи с помощью DeepSeek"
          git push

      - name: Start Cloudflare preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare-preview.yml --ref "${GITHUB_REF_NAME}"

      - name: Add job summary
        shell: bash
        run: |
          {
            echo "## Статьи созданы"
            echo
            echo "Количество: **${{ steps.generate.outputs.article_count }}**"
            echo
            if [ "${{ steps.generate.outputs.scheduled_count }}" -gt 0 ]; then
              echo "Запланировано: **${{ steps.generate.outputs.scheduled_count }}**"
              echo "Период: **${{ steps.generate.outputs.first_publish_at }} — ${{ steps.generate.outputs.last_publish_at }}**"
              echo
            fi
            echo "После завершения Cloudflare workflow проверьте тексты, факты и обложки в Pages CMS."
          } >> "${GITHUB_STEP_SUMMARY}"
