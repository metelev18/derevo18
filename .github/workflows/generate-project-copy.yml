name: Generate catalog or portfolio copy with DeepSeek

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS entry action payload as JSON
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: generate-project-copy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate, validate and save project copy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate DeepSeek configuration
        shell: bash
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "DEEPSEEK_API_KEY is not configured."
            exit 1
          fi

      - name: Generate project copy
        id: generate
        run: node scripts/generate-project-copy.mjs

      - name: Run lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build preview
        run: pnpm build:preview

      - name: Commit generated copy
        env:
          ENTRY_PATH: ${{ steps.generate.outputs.entry_path }}
          ENTRY_TITLE: ${{ steps.generate.outputs.entry_title }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${ENTRY_PATH}"
          if git diff --cached --quiet; then
            echo "DeepSeek did not change the selected entry."
            exit 1
          fi
          git commit -m "content: сформировать описание ${ENTRY_TITLE}"
          git push

      - name: Add job summary
        env:
          ENTRY_PATH: ${{ steps.generate.outputs.entry_path }}
          ENTRY_TITLE: ${{ steps.generate.outputs.entry_title }}
          CONTENT_LABEL: ${{ steps.generate.outputs.content_label }}
        shell: bash
        run: |
          {
            echo "## Текст карточки сформирован"
            echo
            echo "Обновлена ${CONTENT_LABEL}: **${ENTRY_TITLE}**"
            echo
            echo "Файл: \`${ENTRY_PATH}\`"
            echo
            echo "Карточка сохранена как черновик. Проверьте описание и SEO-поля в Pages CMS, затем вручную установите статус «Опубликовано». Факты и фотографии workflow не изменяет."
          } >> "${GITHUB_STEP_SUMMARY}"
