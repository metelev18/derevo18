name: Publish scheduled news

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: Europe/Samara
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandex-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish due articles to Yandex Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://derevo18.com
    env:
      PUBLIC_DEPLOY_ENV: production
      PUBLIC_SITE_URL: https://derevo18.com
      PUBLIC_FORMS_ENDPOINT: ${{ vars.PUBLIC_FORMS_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      AWS_REGION: ru-central1
      AWS_EC2_METADATA_DISABLED: "true"
      YANDEX_BUCKET_NAME: ${{ vars.YANDEX_BUCKET_NAME }}
      YANDEX_STORAGE_ENDPOINT: https://storage.yandexcloud.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare due articles
        id: publish
        run: node scripts/publish-scheduled-news.mjs

      - name: No articles are due
        if: steps.publish.outputs.published_count == '0' && steps.publish.outputs.schedule_paused != 'true'
        run: echo "No scheduled articles are due today." >> "${GITHUB_STEP_SUMMARY}"

      - name: Scheduled publication is paused
        if: steps.publish.outputs.schedule_paused == 'true'
        run: echo "Scheduled publication is paused in Pages CMS." >> "${GITHUB_STEP_SUMMARY}"

      - name: Run lint
        if: steps.publish.outputs.published_count != '0'
        run: pnpm lint

      - name: Run unit tests
        if: steps.publish.outputs.published_count != '0'
        run: pnpm test

      - name: Build production
        if: steps.publish.outputs.published_count != '0'
        run: pnpm build

      - name: Validate Yandex Object Storage configuration
        if: steps.publish.outputs.published_count != '0'
        shell: bash
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Yandex Object Storage access keys are not configured."
            exit 1
          fi

          if [ -z "${YANDEX_BUCKET_NAME}" ]; then
            echo "YANDEX_BUCKET_NAME is not configured in the production environment."
            exit 1
          fi

          if [ ! -f dist/index.html ] || [ ! -f dist/404.html ]; then
            echo "The production build is incomplete."
            exit 1
          fi

          aws s3api head-bucket \
            --bucket "${YANDEX_BUCKET_NAME}" \
            --endpoint-url "${YANDEX_STORAGE_ENDPOINT}"

      - name: Synchronize website with Object Storage
        if: steps.publish.outputs.published_count != '0'
        shell: bash
        run: |
          aws s3 sync dist/ "s3://${YANDEX_BUCKET_NAME}/" \
            --endpoint-url "${YANDEX_STORAGE_ENDPOINT}" \
            --delete \
            --only-show-errors \
            --cache-control "public, max-age=300"

          if [ -d dist/_astro ]; then
            aws s3 cp dist/_astro/ "s3://${YANDEX_BUCKET_NAME}/_astro/" \
              --endpoint-url "${YANDEX_STORAGE_ENDPOINT}" \
              --recursive \
              --only-show-errors \
              --cache-control "public, max-age=31536000, immutable"
          fi

      - name: Commit publication status
        if: steps.publish.outputs.published_count != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/content/news
          git commit -m "content: опубликовать запланированные статьи"
          git push

      - name: Add publication summary
        if: steps.publish.outputs.published_count != '0'
        shell: bash
        run: |
          {
            echo "## Запланированные статьи опубликованы"
            echo
            echo "Количество: **${{ steps.publish.outputs.published_count }}**"
            echo "Дата: **${{ steps.publish.outputs.publication_date }}**"
          } >> "${GITHUB_STEP_SUMMARY}"
